<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Browse Profiles — Miti Mayetri</title>
<meta name="description" content="Browse verified Sindhi matrimonial profiles. Unlock full biodata for ₹49." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script type="module">
  import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  // ====== FILL THESE IN AFTER YOU CREATE YOUR SUPABASE PROJECT ======
  const SUPABASE_URL = "https://bnfmrwdlrmyfpoyrvtwb.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJuZm1yd2Rscm15ZnBveXJ2dHdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM2OTUwNzcsImV4cCI6MjA5OTI3MTA3N30.5vR7D8PCrIyUs3mb1a5rNe35gEQoYQ9CcKSUoemNp-Q";
  // ====================================================================

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const grid = document.getElementById("profile-grid");
  const emptyState = document.getElementById("empty-state");
  const loadingState = document.getElementById("loading-state");

  function rupees(paise) {
    return `₹${(paise / 100).toFixed(0)}`;
  }

  function cardTemplate(p) {
    return `
      <article class="card" data-id="${p.id}">
        <div class="card-badge" title="Locked until unlocked">
          <svg width="14" height="16" viewBox="0 0 14 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 7V4.5C3 2.567 4.567 1 6.5 1S10 2.567 10 4.5V7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/>
            <rect x="1.5" y="7" width="10" height="7.5" rx="1.5" stroke="currentColor" stroke-width="1.4"/>
          </svg>
          <span>Private</span>
        </div>
        <div class="card-top">
          <span class="pill">${p.masked_age ?? "—"} yrs</span>
          <span class="pill">${p.masked_city ?? "—"}</span>
        </div>
        <h3 class="card-profession">${p.masked_profession ?? "Profession on request"}</h3>
        <p class="card-bio">${p.masked_bio ?? ""}</p>
        <button class="unlock-btn" data-id="${p.id}" data-price="${p.unlock_price_paise}">
          Unlock Full Profile — ${rupees(p.unlock_price_paise)} ♥
        </button>
      </article>
    `;
  }

  async function loadProfiles() {
    const { data, error } = await supabase
      .from("public_profiles")
      .select("*")
      .order("created_at", { ascending: false });

    loadingState.style.display = "none";

    if (error) {
      console.error(error);
      emptyState.textContent = "Couldn't load profiles right now. Please refresh.";
      emptyState.style.display = "block";
      return;
    }

    if (!data || data.length === 0) {
      emptyState.style.display = "block";
      return;
    }

    grid.innerHTML = data.map(cardTemplate).join("");
    attachUnlockHandlers();
  }

  function attachUnlockHandlers() {
    document.querySelectorAll(".unlock-btn").forEach((btn) => {
      btn.addEventListener("click", () => openCheckout(btn.dataset.id, Number(btn.dataset.price), btn));
    });
  }

  async function openCheckout(profileId, amountPaise, btnEl) {
    btnEl.disabled = true;
    btnEl.textContent = "Preparing secure checkout…";

    try {
      const orderRes = await fetch("/.netlify/functions/create-order", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ profileId, amountPaise }),
      });
      const order = await orderRes.json();

      if (!orderRes.ok) throw new Error(order.error || "Could not start checkout");

      const rzp = new Razorpay({
        key: order.keyId,
        amount: order.amount,
        currency: order.currency,
        order_id: order.orderId,
        name: "Miti Mayetri",
        description: "Unlock full profile",
        theme: { color: "#7A2036" },
        prefill: {},
        handler: async function (response) {
          btnEl.textContent = "Confirming payment…";
          const verifyRes = await fetch("/.netlify/functions/verify-payment", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              profileId,
              amountPaise,
              razorpay_order_id: response.razorpay_order_id,
              razorpay_payment_id: response.razorpay_payment_id,
              razorpay_signature: response.razorpay_signature,
            }),
          });
          const verify = await verifyRes.json();

          if (verify.verified) {
            btnEl.textContent = "Unlocked ✓ — We'll send full details soon";
            btnEl.classList.add("unlocked");
          } else {
            btnEl.disabled = false;
            btnEl.textContent = "Payment couldn't be verified — try again";
          }
        },
        modal: {
          ondismiss: function () {
            btnEl.disabled = false;
            btnEl.textContent = `Unlock Full Profile — ${rupees(amountPaise)} ♥`;
          },
        },
      });

      rzp.open();
    } catch (err) {
      console.error(err);
      btnEl.disabled = false;
      btnEl.textContent = "Something went wrong — try again";
    }
  }

  loadProfiles();
</script>

<style>
  :root {
    --maroon: #7A2036;
    --maroon-dark: #591626;
    --gold: #C9992F;
    --cream: #FBF5EC;
    --blush: #F3E1DD;
    --ink: #2B2320;
    --ink-soft: #6B5D56;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
  }

  header.page-header {
    background: linear-gradient(135deg, var(--maroon) 0%, var(--maroon-dark) 100%);
    color: #fff;
    padding: 56px 24px 64px;
    text-align: center;
  }

  header.page-header h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(28px, 4vw, 42px);
    margin: 0 0 12px;
  }

  header.page-header p {
    max-width: 560px;
    margin: 0 auto;
    color: #F2DCC8;
    font-size: 15px;
    line-height: 1.6;
  }

  main {
    max-width: 1080px;
    margin: -32px auto 80px;
    padding: 0 24px;
  }

  #profile-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }

  .card {
    background: #fff;
    border-radius: 14px;
    padding: 22px 20px 20px;
    box-shadow: 0 8px 24px rgba(89, 22, 38, 0.08);
    position: relative;
    border: 1px solid rgba(201, 153, 47, 0.18);
  }

  .card-badge {
    position: absolute;
    top: 16px;
    right: 16px;
    display: flex;
    align-items: center;
    gap: 4px;
    color: var(--gold);
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .card-top {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
  }

  .pill {
    background: var(--blush);
    color: var(--maroon-dark);
    font-size: 12.5px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
  }

  .card-profession {
    font-family: 'Playfair Display', serif;
    font-size: 19px;
    margin: 0 0 8px;
    color: var(--ink);
  }

  .card-bio {
    font-size: 14px;
    line-height: 1.55;
    color: var(--ink-soft);
    margin: 0 0 18px;
    min-height: 42px;
  }

  .unlock-btn {
    width: 100%;
    background: var(--maroon);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 14px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
  }

  .unlock-btn:hover:not(:disabled) { background: var(--maroon-dark); }
  .unlock-btn:disabled { opacity: 0.7; cursor: default; }
  .unlock-btn.unlocked { background: #3E7A4E; }

  #loading-state, #empty-state {
    display: none;
    text-align: center;
    color: var(--ink-soft);
    padding: 60px 20px;
    font-size: 15px;
  }
  #loading-state { display: block; }

  @media (prefers-reduced-motion: reduce) {
    .unlock-btn { transition: none; }
  }
</style>
</head>
<body>

<header class="page-header">
  <h1>Browse Verified Profiles</h1>
  <p>Every profile below has been manually reviewed. Age, city, profession and a short bio are shown to everyone — unlock a profile for full biodata, photo and contact details.</p>
</header>

<main>
  <div id="loading-state">Loading profiles…</div>
  <div id="empty-state">No approved profiles yet — please check back soon.</div>
  <div id="profile-grid"></div>
</main>

</body>
</html>
